name: Release

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  release:
    name: "Semantic release"
    runs-on: "ubuntu-latest"
    concurrency:
      group: "semantic-release"
      cancel-in-progress: false
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't bake GITHUB_TOKEN into the origin URL: PSR must push with
          # RELEASE_TOKEN so the branch-protection bypass applies.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install python-semantic-release
        run: python3 -m pip install python-semantic-release==10.7.0

      - name: Verify RELEASE_TOKEN
        # `main` requires a PR, so PSR must push with a token that is a ruleset
        # bypass actor. If RELEASE_TOKEN is unset, GH_TOKEN becomes empty and
        # PSR silently falls back to the default GITHUB_TOKEN (the Actions bot),
        # whose push is rejected. Fail fast and show the token's identity.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is not set; the Actions GITHUB_TOKEN cannot push to protected main"
            exit 1
          fi
          echo "RELEASE_TOKEN authenticates as: $(gh api user --jq .login)"

      - name: Create the release
        # Derives the next SemVer from Conventional Commit messages, bumps the
        # version in pyproject.toml and manifest.json, commits, tags vX.Y.Z and
        # creates the GitHub Release.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: semantic-release -v version
