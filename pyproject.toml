[project]
name = "pga-rangehood"
version = "1.1.1"
description = "Home Assistant integration for WiFi-enabled Sirius and Pando rangehoods"
requires-python = ">=3.14"

[tool.semantic_release]
# Keep the version in lockstep across the files that must agree: pyproject,
# manifest.json (read by HACS/hassfest) and api/const.py (the HTTP User-Agent).
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    'custom_components/pga_rangehood_custom/manifest.json:"version"',
    "custom_components/pga_rangehood_custom/api/const.py:VERSION",
]
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
mode = "init"
